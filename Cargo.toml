[workspace]
resolver = "2"
members = [
  "crates/rdbms_core",
  "crates/rdbms_vfs",
  "crates/rdbms_page",
  "crates/rdbms_wal",
  "crates/rdbms_recovery",
  "crates/rdbms_catalog",
  "crates/rdbms_tx",
  "crates/rdbms_sql",
  "crates/rdbms_ext_abi",
  "crates/rdbms_cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/rdbms"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
